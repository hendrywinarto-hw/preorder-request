<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preorder Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><section id="login" class="login-shell"><form id="login-form" class="login-card"><div class="logo material-symbols-rounded">admin_panel_settings</div><h1>Admin access</h1><p>Sign in to manage preorder requests.</p><label>Admin ID<input id="username" autocomplete="username" placeholder="Admin ID" required></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Password" required></label><small id="login-error"></small><button>Sign in</button></form></section><main id="dashboard" hidden><header><div><p class="overline">PREORDER ADMIN</p><h1>Requests</h1><p id="summary">Loading requests…</p></div><button id="logout" class="ghost"><span class="material-symbols-rounded">logout</span>Log out</button></header><section class="toolbar"><div class="search"><span class="material-symbols-rounded">search</span><input id="search" placeholder="Search name, phone or reference"></div><select id="filter"><option value="">All statuses</option><option value="new">New</option><option value="reviewing">Reviewing</option><option value="quoted">Quoted</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></section><section id="stats" class="stats"></section><section id="requests" class="requests"></section></main><script src="../config.js"></script><script src="admin.js"></script></body></html>
